<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mozy — Nhà máy May Demo</title>
<link rel="stylesheet" href="shared.css">
<style>
body{display:flex;height:100vh;overflow:hidden}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.top{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 20px;font-size:13px;flex-shrink:0}
.top .crumb{color:var(--muted);cursor:pointer} .top .crumb.cur{color:var(--ink);cursor:default}
.top .r{margin-left:auto}
.content{flex:1;overflow:auto;display:flex;flex-direction:column}
.store{width:100%;max-width:1080px;margin:0 auto;padding:28px 24px}
.store h2{margin:0;font-size:22px} .store .sub{display:flex;margin:6px 0 20px;color:var(--muted);font-size:13px}
.store .sub span:last-child{margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mcard{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.mcard .hd{display:flex;align-items:flex-start}
.mcard .hd .badge{margin-left:auto}
.mcard h4{margin:6px 0 0;font-size:15px}
.mcard p{margin:0;color:var(--muted);font-size:13px;min-height:38px}
.mcard .ft{display:flex;gap:8px;margin-top:6px}
.mcard .ft .btn{flex:1;justify-content:center}
iframe{border:0;width:100%;flex:1;display:block}
</style>
</head>
<body>
<main>
  <div class="top" id="top"></div>
  <div class="content" id="content"></div>
</main>
<script>
const APPS = [
  ["theo-doi-van-hanh","📈","#E8F7EE","Theo dõi vận hành","Toàn cảnh đơn hàng, chuyền, kho, chất lượng, nhân sự."],
  ["ke-hoach-san-xuat","📅","#EAF2FD","Kế hoạch sản xuất","Xếp đơn vào chuyền, theo dõi tiến độ, cảnh báo đơn có nguy cơ trễ."],
  ["app-cong-nhan","📱","#EAF2FD","App công nhân","Công nhân xem lương, chấm công, xin nghỉ, hỏi chính sách."],
  ["quan-ly-mau","📐","#F1EBFD","Mẫu & tech pack","Thông số, phiên bản, trạng thái duyệt của từng mã hàng."],
  ["tinh-luong","💰","#FEF4E6","Tính lương","Lương sản phẩm theo công đoạn, lương tháng, phụ cấp, chế độ."],
  ["ke-toan","🧾","#F3F4F6","Kế toán","Thu chi, công nợ, hóa đơn, sổ sách và báo cáo."],
  ["trai-cat","✂️","#FDECEC","Trải – cắt","Phiếu trải theo bàn, quét cuộn vải, theo dõi số lớp và hao hụt."],
  ["kho-nguyen-lieu","📦","#FEF4E6","Quản lý kho nguyên liệu","Hàng về, xuất theo lệnh sản xuất, tồn vải – phụ liệu, cảnh báo thiếu."],
  ["nhan-su","👥","#E8F7EE","Quản lý nhân sự","Hồ sơ, hợp đồng, chấm công; chụp hồ sơ giấy tự điền."],
];
const $ = id => document.getElementById(id);
function home(){
  history.replaceState(null,"","#");
  $("top").innerHTML = `<span class="crumb cur">▦ Danh sách ứng dụng</span>`;
  $("content").innerHTML = `<div class="store"><h2>Danh sách ứng dụng</h2>
    <div class="sub"><span>Các ứng dụng đang chạy trong nhà máy.</span><span>${APPS.length} app</span></div>
    <div class="cards">${APPS.map(([id,ic,bg,name,desc])=>`
      <div class="mcard"><div class="hd"><span class="app-icon" style="background:${bg}">${ic}</span><span class="badge b-ok">● Đang chạy</span></div>
      <h4>${name}</h4><p>${desc}</p>
      <div class="ft"><button class="btn primary sm" onclick="openApp('${id}')">Mở app ↗</button></div></div>`).join("")}
    </div></div>`;
}
function openApp(id){
  const a = APPS.find(x=>x[0]===id); if(!a) return home();
  history.replaceState(null,"","#"+id);
  $("top").innerHTML = `<span class="crumb" onclick="home()">▦ Danh sách ứng dụng</span> / <span class="crumb cur">${a[3]}</span>`;
  $("content").innerHTML = `<iframe src="apps/${id}.html" title="${a[3]}"></iframe>`;
}
location.hash.length>1 ? openApp(location.hash.slice(1)) : home();
</script>
</body>
</html>
