.who{margin-top:auto;display:flex;gap:8px;align-items:center;padding:12px;border-top:1px solid var(--line);font-size:13px}
.main{min-width:0;padding:20px 28px 40px;display:flex;flex-direction:column;gap:16px}
.msel{display:none}
.vh{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.vh h1{margin:0;font-size:24px} .vh p{margin:4px 0 0;color:var(--muted)}
.vh-r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:10px;font-size:13.5px}
.banner .btn{margin-left:auto} .bn-w{background:var(--warn-50);color:#7C3A06} .bn-i{background:var(--primary-50);color:#0B4A94}
.ai{display:flex;gap:14px;align-items:center;padding:16px;flex-wrap:wrap}
.ai .ic{width:44px;height:44px;border-radius:10px;background:var(--violet-50);display:grid;place-items:center;font-size:22px}
.chip{border:1px solid var(--line);border-radius:16px;padding:4px 12px;background:#fff;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--primary-50);color:var(--primary);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.task .ic{width:34px;height:34px;border-radius:8px;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.task .bt{display:flex;gap:6px;margin-left:auto;align-self:center}
.cond{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:center}
.cond:last-child{border:0}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.pane{display:none} .pane.on{display:block}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.form .field{width:100%;min-width:0} .form .w2{grid-column:span 2}
table.t input.field{height:30px;min-width:0;width:110px;text-align:right}
.rep td:nth-child(2){white-space:normal} .rep tr.l0 td{font-weight:700;background:#FAFAFB}
.accs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.acc{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.acc .v{font-size:20px;font-weight:700;margin:6px 0 2px}
.grid2>*,.grid2e>*{min-width:0}
@media (max-width:900px){
  .ka{grid-template-columns:1fr} .side{display:none} .msel{display:block;width:100%}
  .main{padding:14px 16px 32px} .form{grid-template-columns:1fr} .form .w2{grid-column:auto}
}
</style>

/* ---------- điều hướng ---------- */
const name=id=>M.flatMap(g=>g[1]).find(x=>x[0]==id)[1];
document.getElementById("nav").innerHTML=M.map(g=>`<div class="grp"><div>${g[0]}</div>${g[1].map(i=>`<button class="mi" data-v="${i[0]}">${i[1]}</button>`).join("")}</div>`).join("");
document.getElementById("msel").innerHTML=M.map(g=>`<optgroup label="${g[0]}">${g[1].map(i=>`<option value="${i[0]}">${i[1]}</option>`).join("")}</optgroup>`).join("");
function show(id){
  const v=V[id]||(p=>({t:name(id),d:p[0],a:p[1],h:()=>card(name(id),tbl(p[2],p[3]))}))(P[id]);
  document.getElementById("view").innerHTML=`<div class="vh"><div><h1>${v.t}</h1><p>${v.d}</p></div><div class="vh-r">${v.x||""}<select class="field"><option>Tháng 10/2026 · Đang mở</option><option>Tháng 11/2026 · Đang mở</option><option>Tháng 9/2026 · Đã khóa</option></select><button class="btn primary"${v.go?` data-go="${v.go}"`:""}>${v.a}</button></div></div>${v.h()}`;
  document.querySelectorAll(".mi").forEach(b=>b.classList.toggle("on",b.dataset.v==id));
  document.getElementById("msel").value=id; window.scrollTo(0,0);
}
document.getElementById("msel").onchange=e=>show(e.target.value);
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-v],[data-go],[data-tab],[data-f],[data-x]"); if(!t) return;
  if(t.dataset.v||t.dataset.go) return show(t.dataset.v||t.dataset.go);
  if("x" in t.dataset) return t.closest(".task").remove();
  if(t.dataset.tab){const w=t.parentElement.parentElement;w.querySelectorAll(":scope>.tabs2>.tab").forEach(b=>b.classList.toggle("on",b==t));w.querySelectorAll(":scope>.pane").forEach(p=>p.classList.toggle("on",p.dataset.pane==t.dataset.tab));return}
  const fs=t.closest("[data-fs]"); t.parentElement.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c==t));
  if(fs) fs.querySelectorAll("[data-s]").forEach(r=>r.style.display=t.dataset.f=="*"||r.dataset.s.includes(t.dataset.f)?"":"none");
});
show("tq");
</script>
